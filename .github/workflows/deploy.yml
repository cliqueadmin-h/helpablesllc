name: Validate alternate deployment configuration

# Do not revive duplicate automatic deployments. netlify-deploy.yml owns its existing triggers.
on:
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

jobs:
  build-frontend:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type check
        working-directory: ./frontend
        run: npm run type-check

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_STRAPI_URL: ${{ secrets.NEXT_PUBLIC_STRAPI_URL }}
        run: npm run build

      - name: Deploy to Netlify (Production)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: netlify/actions/cli@master
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        with:
          args: deploy --dir=frontend/.next --prod
          
      - name: Deploy to Netlify (Preview)
        if: github.event_name == 'pull_request'
        uses: netlify/actions/cli@master
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        with:
          args: deploy --dir=frontend/.next

  build-and-deploy-cms:
    name: Build and Deploy CMS
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect deploy targets
        id: deploy-targets
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "azure=true" >> "$GITHUB_OUTPUT"
          else
            echo "azure=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "railway=true" >> "$GITHUB_OUTPUT"
          else
            echo "railway=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
          fi

      # Option 1: Deploy to Azure Container Apps
      - name: Deploy to Azure Container Apps
        if: steps.deploy-targets.outputs.azure == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Build and push Docker image to Azure
        if: steps.deploy-targets.outputs.azure == 'true'
        working-directory: ./cms
        run: |
          az acr build --registry ${{ secrets.AZURE_REGISTRY_NAME }} \
            --image strapi-cms:${{ github.sha }} \
            --image strapi-cms:latest \
            --file Dockerfile .
      
      - name: Deploy to Azure Container App
        if: steps.deploy-targets.outputs.azure == 'true'
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINERAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io/strapi-cms:${{ github.sha }}

      # Option 2: Deploy to Railway (using Railway CLI)
      - name: Deploy to Railway
        if: steps.deploy-targets.outputs.railway == 'true'
        working-directory: ./cms
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up --service cms

      # Option 3: Deploy to Render
      - name: Trigger Render Deploy
        if: steps.deploy-targets.outputs.render == 'true'
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
